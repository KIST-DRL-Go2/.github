<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Abstract mark: quadruped robot (left) walking alongside a person (right), sharing one path -->
  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- shared path -->
    <path d="M12 85 Q50 79 88 85" stroke-width="4" opacity="0.55"/>
    <!-- quadruped: body -->
    <path d="M17 50 H47" stroke-width="7"/>
    <!-- quadruped: neck + sensor head -->
    <path d="M47 50 L54 42 H62" stroke-width="7"/>
    <!-- quadruped: legs (thigh + shin, walking gait) -->
    <path d="M21 53 L18 64 L24 74" stroke-width="5.5"/>
    <path d="M44 53 L47 64 L53 74" stroke-width="5.5"/>
    <!-- person: torso + legs -->
    <path d="M76 39 V58" stroke-width="7"/>
    <path d="M76 58 L70 73" stroke-width="5.5"/>
    <path d="M76 58 L83 73" stroke-width="5.5"/>
  </g>
  <!-- person: head -->
  <circle cx="76" cy="27" r="6.5" fill="currentColor"/>
</svg>
